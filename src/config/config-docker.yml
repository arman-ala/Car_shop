server:
  port: 8080
  runMode: debug
logger:
  filePath: ../logs/log.log
  encoding: json
  level: debug
cors:
  allowOrigins: "*"
postgres:
  host: postgres_container
  port: 5432
  user: postgres
  password: admin
  dbName: car_shop
  sslMode: false
redis:
  host: redis_container
  port: 6379
  password: password
  db: 0
  minIdleConnections: 100
  poolSize: 5000
  poolTimeout: 240
validator:
  password:
    min: 8
    max: 64
    includeChars: true
    includeDigits: true
    includeUpper: true
    includeLower: true
    includeSpace: false
