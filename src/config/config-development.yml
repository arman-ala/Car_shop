server:
  port: 8080
  runMode: debug
logger:
  filePath: ../logs/log.log
  encoding: json
  level: debug
cors:
  allowOrigins: "*"
postgres:
  host: localhost
  port: 5432
  user: postgres
  password: admin
  dbName: car_shop
  sslMode: false
redis:
  host: redis_container
  port: 6379
  password: password
  db: 0
  dialTimeout: "5s"
  readTimeout: "5s"
  writeTimeout: "5s"
  poolSize: 10
  poolTimeout: "15s"
  idleTimeOut: "500ms"
  idleCheckFrequency: 500
validator:
  password:
    min: 8
    max: 64
    includeChars: true
    includeDigits: true
    includeUpper: true
    includeLower: true
    includeSpace: false
