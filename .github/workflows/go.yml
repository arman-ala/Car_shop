name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Tidy dependencies
        working-directory: ./src
        run: go mod tidy

      - name: Download dependencies
        working-directory: ./src
        run: go mod download

      - name: Build
        working-directory: ./src
        run: go build -v ./...

      - name: Test
        working-directory: ./src
        run: go test -v ./...
